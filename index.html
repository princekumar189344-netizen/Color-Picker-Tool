<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Picker Tool</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Color Picker Tool</h1>

        <div class="color-box" id="colorBox"></div>

        <input type="color" id="colorPicker" value="#4CAF50">

        <p>Selected Color:</p>
        <h2 id="colorCode">#4CAF50</h2>

        <button onclick="copyColor()">Copy Color Code</button>
    </div>

    <script src="javascript.js"></script>

</body>
</html>
